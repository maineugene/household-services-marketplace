<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты поиска — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="page">
    <a href="/search" class="btn-back">← Новый поиск</a>

    <div class="toolbar">
        <div class="page-header" style="margin-bottom:0;">
            <h1>Результаты поиска</h1>
            <p>Найдено специалистов: <strong th:text="${totalResults}">0</strong></p>
        </div>
        <div class="inline-field">
            <label for="sortSelect" style="margin-bottom:0;">Сортировка:</label>
            <select id="sortSelect" onchange="window.location.href=this.value">
                <option value="?sortBy=rating_desc" th:selected="${param.sortBy == 'rating_desc'}">По рейтингу (высокий)</option>
                <option value="?sortBy=price_asc" th:selected="${param.sortBy == 'price_asc'}">По цене (дешевле)</option>
            </select>
        </div>
    </div>

    <div th:if="${specialists.empty}" class="empty-state">
        <div class="empty-state__icon">🔍</div>
        <p>По вашему запросу ничего не найдено.</p>
        <a href="/search" class="btn btn-primary" style="margin-top:14px;">Изменить параметры</a>
    </div>

    <div class="grid grid--cards" th:unless="${specialists.empty}">
        <div th:each="spec : ${specialists}" class="card card--hover">
            <h3 class="card__title" th:text="${spec.user.firstName} + ' ' + ${spec.user.lastName}">Имя</h3>
            <p class="text-muted" th:text="${spec.description}">Описание</p>
            <div class="stack" style="margin-top:14px;">
                <div><span class="rating">⭐ <span th:text="${spec.averageRating}">0</span></span></div>
                <div class="price" th:text="${spec.hourlyRate != null ? spec.hourlyRate + ' ₽/час' : spec.fixedPrice + ' ₽'}">0 ₽</div>
                <div class="text-muted">📍 <span th:text="${spec.serviceArea}">Город</span></div>
            </div>
            <div class="actions">
                <a th:href="@{/specialist/public/{id}(id=${spec.id})}" class="btn btn-primary btn-sm">Подробнее</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
