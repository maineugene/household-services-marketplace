<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск специалистов — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="page page--narrow">
    <div class="page-header">
        <h1>Поиск специалистов</h1>
        <p>Найдите подходящего исполнителя по услуге, категории и городу.</p>
    </div>

    <div class="card">
        <form th:action="@{/search/results}" method="get" class="stack">
            <div class="form-group">
                <label for="query">Услуга</label>
                <input type="search" id="query" name="query" placeholder="Например: ремонт сантехники">
            </div>
            <div class="form-group">
                <label for="category">Категория</label>
                <select id="category" name="category">
                    <option value="">Все категории</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Город</label>
                <input type="text" id="location" name="location" placeholder="Москва">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Найти</button>
        </form>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
