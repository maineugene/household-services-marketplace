<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль специалиста — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="page page--narrow">
    <a href="/search" class="btn-back">← К поиску</a>

    <div class="page-header">
        <h1 th:text="${profile.user.firstName} + ' ' + ${profile.user.lastName}">Специалист</h1>
    </div>

    <div class="card">
        <div class="stack">
            <div class="detail-row"><strong>Описание:</strong> <span th:text="${profile.description}"></span></div>
            <div class="detail-row"><strong>Опыт:</strong> <span th:text="${profile.experienceYears}"></span> лет</div>
            <div class="detail-row"><strong>Образование:</strong> <span th:text="${profile.education}"></span></div>
            <div class="detail-row"><strong>Категории:</strong> <span th:text="${profile.categories}"></span></div>
            <div class="detail-row"><strong>Рейтинг:</strong> <span class="rating">⭐ <span th:text="${profile.averageRating}"></span></span></div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
