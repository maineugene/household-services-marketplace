<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль специалиста — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="page page--narrow">
    <div class="page-header">
        <h1 th:text="${isEdit} ? 'Редактирование профиля' : 'Создание профиля'">Профиль</h1>
        <p>Заполните информацию, чтобы клиенты могли вас найти.</p>
    </div>

    <div class="card">
        <form th:action="@{/specialist/profile/save}" th:object="${profile}" method="post">
            <div class="form-group">
                <label>Описание</label>
                <textarea th:field="*{description}" rows="5" placeholder="Расскажите о себе и своих услугах..."></textarea>
            </div>
            <div class="form-group">
                <label>Опыт (лет)</label>
                <input type="number" th:field="*{experienceYears}">
            </div>
            <div class="form-group">
                <label>Образование</label>
                <input type="text" th:field="*{education}">
            </div>
            <div class="form-group">
                <label>Категории <span class="form-hint" style="display:inline;">(удерживайте Ctrl для выбора нескольких)</span></label>
                <select th:field="*{categories}" multiple>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Почасовая ставка (₽/час)</label>
                <input type="number" th:field="*{hourlyRate}" step="100">
            </div>
            <div class="form-group">
                <label>Фиксированная цена (₽)</label>
                <input type="number" th:field="*{fixedPrice}" step="100">
            </div>
            <div class="form-group">
                <label>География обслуживания</label>
                <input type="text" th:field="*{serviceArea}" placeholder="Москва и область">
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Сохранить</button>
        </form>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
