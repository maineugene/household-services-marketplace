<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали заказа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div style="max-width: 800px; margin: 20px auto; padding: 20px;">
    <h1>Детали заказа #<span th:text="${order.id}"></span></h1>

    <div style="background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px;">
        <p><strong>Описание:</strong> <span th:text="${order.description}"></span></p>
        <p><strong>Адрес:</strong> <span th:text="${order.address}"></span></p>
        <p><strong>Бюджет:</strong> <span th:text="${order.budget} + ' ₽'"></span></p>
        <p><strong>Статус:</strong> <span th:text="${order.status}"></span></p>

        <div th:if="${showBidsLink}" style="margin-top: 20px;">
            <a th:href="@{/bids/order/{orderId}(orderId=${order.id})}" class="btn">Просмотр заявок (<span th:text="${bidsCount}"></span>)</a>
        </div>

        <div th:if="${canApply}" style="margin-top: 20px;">
            <a th:href="@{/bids/create/{orderId}(orderId=${order.id})}" class="btn">Подать заявку</a>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
