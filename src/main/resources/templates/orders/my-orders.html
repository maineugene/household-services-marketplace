<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="page">
    <div class="page-header">
        <h1 th:text="${role == 'customer'} ? 'Мои заказы' : 'Мои задания'">Мои заказы</h1>
    </div>

    <div th:if="${orders.empty}" class="empty-state">
        <div class="empty-state__icon">📋</div>
        <p>У вас пока нет заказов.</p>
        <a th:if="${role == 'customer'}" href="/orders/create" class="btn btn-primary" style="margin-top:14px;">Создать заказ</a>
    </div>

    <div th:each="order : ${orders}" class="card" style="margin-bottom:18px;">
        <div class="card-header">
            <strong>Заказ #<span th:text="${order.id}">0</span></strong>
            <span class="status" th:classappend="'status-' + ${order.status}" th:text="${order.status}">STATUS</span>
        </div>

        <div class="stack">
            <div class="detail-row"><strong>Описание:</strong> <span th:text="${order.description}"></span></div>
            <div class="detail-row"><strong>Адрес:</strong> <span th:text="${order.address}"></span></div>
            <div class="detail-row"><strong>Бюджет:</strong> <span class="price" th:text="${order.budget} + ' ₽'"></span></div>
            <div class="detail-row"><strong>Срок:</strong> <span th:text="${#temporals.format(order.deadline, 'dd.MM.yyyy HH:mm')}"></span></div>
            <div class="detail-row" th:if="${order.specialist != null}">
                <strong>Исполнитель:</strong>
                <span th:text="${order.specialist.firstName + ' ' + order.specialist.lastName}"></span>
            </div>
        </div>

        <div class="actions">
            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-primary btn-sm">Подробнее</a>

            <form th:if="${role == 'customer' and order.status == 'ACTIVE'}"
                  th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post">
                <button type="submit" class="btn btn-danger btn-sm">Отменить</button>
            </form>

            <form th:if="${(role == 'customer' or role == 'specialist') and order.status == 'IN_PROGRESS'}"
                  th:action="@{/orders/{id}/complete(id=${order.id})}" method="post">
                <button type="submit" class="btn btn-success btn-sm">Завершить</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
