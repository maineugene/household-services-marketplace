<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступные заказы — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="page">
    <div class="page-header">
        <h1>Доступные заказы</h1>
        <p>Откликайтесь на заказы и получайте работу.</p>
    </div>

    <div th:if="${orders.empty}" class="empty-state">
        <div class="empty-state__icon">💼</div>
        <p>Сейчас нет доступных заказов. Загляните позже.</p>
    </div>

    <div class="grid grid--cards" th:unless="${orders.empty}">
        <div th:each="order : ${orders}" class="card card--hover">
            <h3 class="card__title">Заказ #<span th:text="${order.id}">0</span></h3>
            <div class="detail-row"><strong>Описание:</strong> <span th:text="${order.description}"></span></div>
            <div class="detail-row"><strong>Бюджет:</strong> <span class="price" th:text="${order.budget} + ' ₽'"></span></div>
            <div class="actions">
                <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-primary btn-sm">Подробнее</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
