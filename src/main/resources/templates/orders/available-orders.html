<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Доступные заказы</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div style="max-width: 1000px; margin: 20px auto; padding: 20px;">
    <h1>Доступные заказы</h1>

    <div th:if="${orders.empty}">
        <p>Нет доступных заказов.</p>
    </div>

    <div th:each="order : ${orders}" style="border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px;">
        <h3>Заказ #<span th:text="${order.id}"></span></h3>
        <p><strong>Описание:</strong> <span th:text="${order.description}"></span></p>
        <p><strong>Бюджет:</strong> <span th:text="${order.budget} + ' ₽'"></span></p>
        <a th:href="@{/orders/{id}(id=${order.id})}" class="btn">Подробнее</a>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
