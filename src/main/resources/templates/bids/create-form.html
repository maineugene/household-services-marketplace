<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подача заявки — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="page page--narrow">
    <div class="page-header">
        <h1>Подача заявки</h1>
        <p>Предложите свою цену и расскажите, как выполните работу.</p>
    </div>

    <div class="card" style="margin-bottom:18px; background:var(--color-primary-light); border-color:transparent;">
        <h3 style="margin-bottom:12px;">Информация о заказе</h3>
        <div class="detail-row"><strong>Описание:</strong> <span th:text="${order.description}"></span></div>
        <div class="detail-row"><strong>Бюджет заказчика:</strong> <span class="price" th:text="${order.budget} + ' ₽'"></span></div>
        <div class="detail-row"><strong>Срок:</strong> <span th:text="${#temporals.format(order.deadline, 'dd.MM.yyyy HH:mm')}"></span></div>
    </div>

    <div class="card">
        <form th:action="@{/bids/create/{orderId}(orderId=${order.id})}" th:object="${bid}" method="post">
            <div class="form-group">
                <label>Ваша цена (₽)</label>
                <input type="number" th:field="*{price}" step="100" required>
            </div>
            <div class="form-group">
                <label>Комментарий к заявке</label>
                <textarea th:field="*{comment}" placeholder="Опишите, как вы планируете выполнить работу..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Подать заявку</button>
        </form>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
