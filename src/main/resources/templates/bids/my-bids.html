<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заявки — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="page">
    <div class="page-header">
        <h1>Мои заявки</h1>
    </div>

    <div th:if="${bids.empty}" class="empty-state">
        <div class="empty-state__icon">📨</div>
        <p>Вы ещё не подавали заявок на заказы.</p>
        <a href="/orders/available" class="btn btn-primary" style="margin-top:14px;">Посмотреть доступные заказы</a>
    </div>

    <div th:each="bid : ${bids}" class="card" style="margin-bottom:16px;">
        <div class="card-header">
            <strong>Заказ #<span th:text="${bid.order.id}">0</span></strong>
            <span th:if="${bid.isSelected}" class="badge badge-success">✅ Выбрана</span>
            <span th:unless="${bid.isSelected}" class="badge badge-warning">⏳ На рассмотрении</span>
        </div>

        <div class="stack">
            <div class="detail-row"><strong>Описание заказа:</strong> <span th:text="${bid.order.description}"></span></div>
            <div class="detail-row"><strong>Ваша цена:</strong> <span class="price" th:text="${bid.price} + ' ₽'"></span></div>
            <div class="detail-row"><strong>Ваш комментарий:</strong> <span th:text="${bid.comment}"></span></div>
            <div class="detail-row"><strong>Бюджет заказчика:</strong> <span th:text="${bid.order.budget} + ' ₽'"></span></div>
            <div class="detail-row"><strong>Дата подачи:</strong> <span th:text="${#temporals.format(bid.createdAt, 'dd.MM.yyyy HH:mm')}"></span></div>
        </div>

        <div class="actions">
            <a th:href="@{/orders/{id}(id=${bid.order.id})}" class="btn btn-primary btn-sm">Подробнее о заказе</a>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
