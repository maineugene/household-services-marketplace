<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки на заказ — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="page">
    <a href="/orders/my" class="btn-back">← Назад к моим заказам</a>

    <div class="page-header">
        <h1>Заявки на заказ #<span th:text="${order.id}">0</span></h1>
    </div>

    <div class="card" style="margin-bottom:22px; background:var(--color-primary-light); border-color:transparent;">
        <h3 style="margin-bottom:12px;">Информация о заказе</h3>
        <div class="detail-row"><strong>Описание:</strong> <span th:text="${order.description}"></span></div>
        <div class="detail-row"><strong>Адрес:</strong> <span th:text="${order.address}"></span></div>
        <div class="detail-row"><strong>Бюджет:</strong> <span class="price" th:text="${order.budget} + ' ₽'"></span></div>
        <div class="detail-row"><strong>Срок:</strong> <span th:text="${#temporals.format(order.deadline, 'dd.MM.yyyy HH:mm')}"></span></div>
        <div class="detail-row">
            <strong>Статус:</strong>
            <span class="badge badge-warning" th:if="${order.status == 'ACTIVE'}">Активен</span>
            <span class="badge badge-info" th:if="${order.status == 'IN_PROGRESS'}">В работе</span>
            <span class="badge badge-success" th:if="${order.status == 'COMPLETED'}">Завершён</span>
        </div>
    </div>

    <div th:if="${bids.empty}" class="empty-state">
        <div class="empty-state__icon">📨</div>
        <p>Пока нет заявок на этот заказ.</p>
    </div>

    <div th:each="bid : ${bids}" class="card" style="margin-bottom:16px;">
        <div class="card-header">
            <div>
                <div style="font-weight:700; font-size:1.05rem;" th:text="${bid.specialist.firstName} + ' ' + ${bid.specialist.lastName}">Имя</div>
                <div class="card__meta">⭐ Рейтинг: <span th:text="${bid.specialist.specialistProfile?.averageRating ?: 'Нет оценок'}">—</span></div>
            </div>
            <span th:if="${bid.isSelected}" class="badge badge-success">✅ Выбранный исполнитель</span>
        </div>

        <div class="stack">
            <div class="detail-row"><strong>Предложенная цена:</strong> <span class="price" th:text="${bid.price} + ' ₽'"></span></div>
            <div class="detail-row"><strong>Комментарий:</strong> <span th:text="${bid.comment}"></span></div>
            <div class="detail-row"><strong>Дата подачи:</strong> <span th:text="${#temporals.format(bid.createdAt, 'dd.MM.yyyy HH:mm')}"></span></div>
        </div>

        <div class="actions">
            <form th:if="${order.status == 'ACTIVE' and !bid.isSelected}"
                  th:action="@{/bids/{bidId}/select(bidId=${bid.id})}" method="post">
                <button type="submit" class="btn btn-success btn-sm">Выбрать этого специалиста</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
