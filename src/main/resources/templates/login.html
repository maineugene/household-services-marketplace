<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — СпецПлатформа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar__inner">
        <a href="/" class="navbar__brand">
            <span class="navbar__logo">⚙</span>
            <span>СпецПлатформа</span>
        </a>
        <div class="navbar__right">
            <a th:href="@{/register}" class="btn btn-outline btn-sm">Регистрация</a>
        </div>
    </div>
</nav>

<main class="page--auth">
    <div class="form-card">
        <h1 class="text-center" style="margin-bottom:6px;">Вход в аккаунт</h1>
        <p class="text-center text-muted" style="margin-bottom:24px;">Рады видеть вас снова</p>

        <div th:if="${param.error}" class="alert alert-danger">Неверный email или пароль.</div>
        <div th:if="${param.success}" class="alert alert-success">Регистрация прошла успешно! Войдите в аккаунт.</div>
        <div th:if="${param.logout}" class="alert alert-info">Вы вышли из аккаунта.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="text" id="username" name="username" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Войти</button>
        </form>

        <p class="text-center text-muted" style="margin-top:18px;">
            Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
        </p>
    </div>
</main>

</body>
</html>
