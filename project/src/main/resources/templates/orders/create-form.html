<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание заказа</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        textarea {
            min-height: 100px;
        }
        button {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        .error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="form-container">
    <h1>Создать заказ</h1>

    <form th:action="@{/orders/create}" th:object="${order}" method="post">
        <div class="form-group">
            <label>Описание задачи:</label>
            <textarea th:field="*{description}" placeholder="Опишите подробно, что нужно сделать..."></textarea>
            <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </div>

        <div class="form-group">
            <label>Адрес:</label>
            <input type="text" th:field="*{address}" placeholder="ул. Ленина 10, кв. 5">
            <span class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
        </div>

        <div class="form-group">
            <label>Бюджет (₽):</label>
            <input type="number" th:field="*{budget}" step="100" placeholder="1000">
            <span class="error" th:if="${#fields.hasErrors('budget')}" th:errors="*{budget}"></span>
        </div>

        <div class="form-group">
            <label>Срок выполнения:</label>
            <input type="datetime-local" th:field="*{deadline}">
            <span class="error" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></span>
        </div>

        <button type="submit">Создать заказ</button>
    </form>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
