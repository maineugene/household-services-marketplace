<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Результаты поиска</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div style="max-width: 1000px; margin: 20px auto; padding: 20px;">
    <h1>Результаты поиска</h1>
    <a href="/search">← Новый поиск</a>
    <p>Найдено: <span th:text="${totalResults}"></span> специалистов</p>

    <!-- Сортировка -->
    <div style="margin: 20px 0;">
        <label>Сортировать:</label>
        <select id="sortSelect" onchange="window.location.href=this.value">
            <option value="?sortBy=rating_desc" th:selected="${param.sortBy == 'rating_desc'}">По рейтингу (высокий)</option>
            <option value="?sortBy=price_asc" th:selected="${param.sortBy == 'price_asc'}">По цене (дешевые)</option>
        </select>
    </div>

    <div th:if="${specialists.empty}" style="text-align: center; padding: 50px;">
        <p>Ничего не найдено</p>
    </div>

    <div th:each="spec : ${specialists}" style="border: 1px solid #ddd; padding: 15px; margin-top: 15px; border-radius: 5px;">
        <h3 th:text="${spec.user.firstName} + ' ' + ${spec.user.lastName}"></h3>
        <p th:text="${spec.description}"></p>
        <p>⭐ <span th:text="${spec.averageRating}"></span></p>
        <p>💰 <span th:text="${spec.hourlyRate != null ? spec.hourlyRate + ' ₽/час' : spec.fixedPrice + ' ₽'}"></span></p>
        <p>📍 <span th:text="${spec.serviceArea}"></span></p>
        <a th:href="@{/specialist/public/{id}(id=${spec.id})}" class="btn">Подробнее</a>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
