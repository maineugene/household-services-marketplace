<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Поиск специалистов</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div style="max-width: 600px; margin: 20px auto; padding: 20px;">
    <h1>Поиск специалистов</h1>

    <form th:action="@{/search/results}" method="get">
        <input type="text" name="query" placeholder="Поиск по услугам..."
               style="width: 100%; padding: 10px; margin-bottom: 10px;">

        <select name="category" style="width: 100%; padding: 10px; margin-bottom: 10px;">
            <option value="">Все категории</option>
            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
        </select>

        <input type="text" name="location" placeholder="Город"
               style="width: 100%; padding: 10px; margin-bottom: 10px;">

        <button type="submit" style="width: 100%; padding: 10px;">Найти</button>
    </form>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
