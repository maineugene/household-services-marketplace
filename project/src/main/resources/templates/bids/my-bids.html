<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заявки</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .bids-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .bid-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: white;
        }
        .bid-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .status-selected {
            background: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-pending {
            background: #ffc107;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .price {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .empty-state {
            text-align: center;
            padding: 50px;
            background: #f9f9f9;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="bids-container">
    <h1>Мои заявки</h1>

    <div th:if="${bids.empty}" class="empty-state">
        <p>Вы еще не подавали заявок на заказы.</p>
        <a href="/orders/available" class="btn">Посмотреть доступные заказы</a>
    </div>

    <div th:each="bid : ${bids}" class="bid-card">
        <div class="bid-header">
            <strong>Заказ #<span th:text="${bid.order.id}"></span></strong>
            <span th:class="${bid.isSelected} ? 'status-selected' : 'status-pending'">
                <span th:if="${bid.isSelected}">✅ Выбрана</span>
                <span th:unless="${bid.isSelected}">⏳ На рассмотрении</span>
            </span>
        </div>

        <div class="bid-details">
            <p><strong>Описание заказа:</strong> <span th:text="${bid.order.description}"></span></p>
            <p><strong>Ваша цена:</strong> <span class="price" th:text="${bid.price} + ' ₽'"></span></p>
            <p><strong>Ваш комментарий:</strong> <span th:text="${bid.comment}"></span></p>
            <p><strong>Бюджет заказчика:</strong> <span th:text="${bid.order.budget} + ' ₽'"></span></p>
            <p><strong>Дата подачи:</strong> <span th:text="${#temporals.format(bid.createdAt, 'dd.MM.yyyy HH:mm')}"></span></p>
        </div>

        <a th:href="@{/orders/{id}(id=${bid.order.id})}" class="btn">Подробнее о заказе</a>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
